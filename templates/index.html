<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Health AI Chatbot</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        #chatbox { width: 100%; height: 400px; border: 1px solid #ccc; 
                   padding: 10px; overflow-y: scroll; }
        .user { color: blue; margin-bottom: 10px; }
        .bot { color: green; margin-bottom: 10px; }
        #inputBox { width: 80%; padding: 10px; }
        #btn { padding: 10px 20px; }
    </style>
</head>
<body>

<h2>Local Health AI Chatbot (Mistral + RAG)</h2>

<div id="chatbox"></div>

<br>

<input id="inputBox" type="text" placeholder="Ask a health question...">
<button id="btn">Send</button>

<script>
document.getElementById("btn").onclick = async function () {
    const q = document.getElementById("inputBox").value;
    document.getElementById("inputBox").value = "";

    let chat = document.getElementById("chatbox");
    chat.innerHTML += `<div class='user'><b>You:</b> ${q}</div>`;

    const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q })
    });

    const data = await response.json();

    chat.innerHTML += `<div class='bot'><b>AI:</b> ${data.answer}</div>`;
    chat.scrollTop = chat.scrollHeight;
};
</script>

</body>
</html>
